name: Daily publish

on:
  schedule:
    - cron: "30 20 * * *"   # 매일 05:30 KST (UTC 20:30)
    - cron: "30 21 * * *"   # 백업 06:30 KST — 첫 실행이 빠졌을 때만 실제 수집
  workflow_dispatch:
    inputs:
      skip_if_exists:
        description: "오늘 치가 있으면 수집 생략 (템플릿만 다시 빌드)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Fonts for Instagram card
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum fonts-liberation

      - run: pip install -r requirements.txt

      - name: Collect, summarize, build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NEWS_KEYWORDS: ${{ vars.NEWS_KEYWORDS || '부동산,아파트 매매,전세,청약,주택담보대출,분양,재건축' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://hyungmo1234.github.io/daily-house' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.skip_if_exists }}" = "true" ]; then
            python run.py --skip-if-exists
          else
            python run.py
          fi

      - name: Commit today's data
        run: |
          git config user.name "daily-house-bot"
          git config user.email "daily-house-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  instagram:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Wait for Pages CDN
        run: sleep 25

      - name: Publish Instagram post
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://hyungmo1234.github.io/daily-house' }}
        run: python run.py --instagram

      - name: Remember posted media id
        run: |
          git config user.name "daily-house-bot"
          git config user.email "daily-house-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no instagram marker"
          else
            git commit -m "instagram: $(TZ=Asia/Seoul date +%F)"
            git push
          fi
