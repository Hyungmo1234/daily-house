name: Daily publish

on:
  schedule:
    # GitHub cron은 매시 정각·30분에 잘 빠짐. 분을 흩뿌리고 아침 동안 여러 번 재시도.
    - cron: "17 20 * * *"   # 05:17 KST
    - cron: "11 21 * * *"   # 06:11 KST
    - cron: "23 22 * * *"   # 07:23 KST
    - cron: "41 23 * * *"   # 08:41 KST
    - cron: "7 0 * * *"     # 09:07 KST
  repository_dispatch:
    types: [daily-publish]
  workflow_dispatch:
    inputs:
      skip_if_exists:
        description: "오늘 치가 있으면 수집 생략 (템플릿만 다시 빌드)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - id: gate
        name: Skip if today already published
        run: |
          DATE=$(TZ=Asia/Seoul date +%F)
          FILE="data/${DATE}.json"
          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.skip_if_exists != true }}"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "manual rerun for $DATE"
            exit 0
          fi
          if [ -f "$FILE" ] && python3 -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); sys.exit(0 if (d.get('instagram') or {}).get('media_id') else 1)" "$FILE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "already published $DATE"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "need publish $DATE"
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.gate.outputs.skip != 'true'
        name: Fonts for Instagram card
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum fonts-liberation

      - if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - if: steps.gate.outputs.skip != 'true'
        name: Collect, summarize, build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NEWS_KEYWORDS: ${{ vars.NEWS_KEYWORDS || '부동산,아파트 매매,전세,청약,주택담보대출,분양,재건축' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://hyungmo1234.github.io/daily-house' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ] || [ "${{ inputs.skip_if_exists }}" = "true" ]; then
            python run.py --skip-if-exists
          else
            python run.py
          fi

      - if: steps.gate.outputs.skip != 'true'
        name: Commit today's data
        run: |
          git config user.name "daily-house-bot"
          git config user.email "daily-house-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/configure-pages@v5
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  instagram:
    needs: deploy
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Wait for Pages CDN
        run: sleep 25

      - name: Publish Instagram post
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://hyungmo1234.github.io/daily-house' }}
        run: python run.py --instagram

      - name: Remember posted media id
        run: |
          git config user.name "daily-house-bot"
          git config user.email "daily-house-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no instagram marker"
          else
            git commit -m "instagram: $(TZ=Asia/Seoul date +%F)"
            git push
          fi
